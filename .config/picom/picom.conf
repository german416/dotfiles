#############################################
# picom.conf ultra ligero para Qtile        #
# Transparencia solo en terminales          #
#############################################

# --- Habilita el blur ---
blur: {
  method = "dual_kawase";  # Método más suave y eficiente (recomendado)
  strength = 8;           # Intensidad (valores entre 3-12)
  background = true;       # Aplica blur al fondo de la ventana
  background-frame = true; # Necesario para ventanas transparentes
  background-fixed = true; # Evita artefactos visuales
}

# --- Backend y rendimiento ---
backend = "glx";
vsync = true;               # Evita tearing
use-damage = true;          # Menos consumo de CPU
unredir-if-possible = true; # No renderizar si no es necesario

# --- Sin sombras ---
shadow = false;

# --- Sin bordes redondeados ---
corner-radius = 0;

# --- Animaciones de desvanecimiento ---
fading = true;
fade-in-step = 0.04;        # Pasos más grandes = menos frames procesados
fade-out-step = 0.04;
fade-delta = 10;

# --- Transparencia ---
# Detecta terminales comunes automáticamente
opacity-rule = [
  "100:class_g = 'qtile'",   # Barra de Qtile opaca
  "90:class_g *?= 'term'",   # Cualquier ventana con 'term' en el nombre de clase
  "90:class_g *?= 'Term'",   # Mayúscula por compatibilidad
  "90:class_g *?= 'org.wezfurlong.wezterm'",
  "90:class_g *?= 'Konsole'"
];

# --- Tipos de ventanas ---
wintypes:
{
  dock = { shadow = false; opacity = 1.0; focus = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 1.0; };
  dropdown_menu = { opacity = 1.0; };
};
